name: Build, Release and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.1.0）'
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOCKER_BUILD_SUMMARY: 'false'

concurrency:
  group: "release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}"
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      tag_sha: ${{ steps.version.outputs.tag_sha }}
      build_time: ${{ steps.version.outputs.build_time }}
      image_repo: ${{ steps.version.outputs.image_repo }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 计算版本号
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${RAW_VERSION}"
            if [ -z "$VERSION" ]; then
              echo "::error::workflow_dispatch requires an explicit version"
              exit 1
            fi
            if printf '%s' "$VERSION" | grep -Eq '^v'; then
              echo "::error::workflow_dispatch version must not include the v prefix"
              exit 1
            fi
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
              echo "::error::version must look like 0.1.0 or 0.1.0-rc.1"
              exit 1
            fi
            TAG="v${VERSION}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              TAG_SHA="$(git rev-list -n 1 "${TAG}^{commit}")"
            else
              TAG_SHA="$(git rev-parse HEAD)"
              echo "::notice::workflow_dispatch tag ${TAG} does not exist; release will create it from ${TAG_SHA}"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+){2}([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
              echo "::error::tag must look like v0.1.0 or v0.1.0-rc.1"
              exit 1
            fi
            VERSION="${TAG#v}"
            TAG_SHA="$(git rev-list -n 1 "${TAG}^{commit}")"
          fi
          STABLE="false"
          if printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){2}$'; then
            STABLE="true"
          fi
          BUILD_TIME="$(git show -s --format=%cI "$TAG_SHA")"
          REPO_OWNER="$(printf '%s' "${GITHUB_REPOSITORY%/*}" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME_KEBAB="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | sed -E 's/([[:lower:][:digit:]])([[:upper:]])/\1-\2/g; s/[[:space:]_]+/-/g' | tr '[:upper:]' '[:lower:]')"
          IMAGE_REPO="${REPO_OWNER}/${REPO_NAME_KEBAB}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

  verify-go:
    needs: [version, build-admin]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download admin assets
        uses: actions/download-artifact@v8
        with:
          name: admin-web-sync
          path: .

      - name: Restore admin assets
        run: |
          mkdir -p internal/server/web
          tar -xzf admin-web-sync.tar.gz -C internal/server/web
          test -f internal/server/web/dist/admin/index.html

      - name: Run Go verification
        run: |
          go vet ./...
          go test ./...

  build-server:
    needs: [version, build-admin, verify-go]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            cmd_path: ./cmd/server
            os: linux
            arch: amd64
            output: cyber-monitor-server-linux-amd64
          - name: server
            cmd_path: ./cmd/server
            os: linux
            arch: arm64
            output: cyber-monitor-server-linux-arm64
          - name: server
            cmd_path: ./cmd/server
            os: linux
            arch: arm
            goarm: 7
            output: cyber-monitor-server-linux-armv7
          - name: server
            cmd_path: ./cmd/server
            os: darwin
            arch: amd64
            output: cyber-monitor-server-darwin-amd64
          - name: server
            cmd_path: ./cmd/server
            os: darwin
            arch: arm64
            output: cyber-monitor-server-darwin-arm64
          - name: server
            cmd_path: ./cmd/server
            os: windows
            arch: amd64
            output: cyber-monitor-server-windows-amd64.exe
          - name: server
            cmd_path: ./cmd/server
            os: freebsd
            arch: amd64
            output: cyber-monitor-server-freebsd-amd64
          - name: server
            cmd_path: ./cmd/server
            os: freebsd
            arch: arm64
            output: cyber-monitor-server-freebsd-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download admin assets
        uses: actions/download-artifact@v8
        with:
          name: admin-web-sync
          path: .

      - name: Restore admin assets
        run: |
          mkdir -p internal/server/web
          tar -xzf admin-web-sync.tar.gz -C internal/server/web
          test -f internal/server/web/dist/admin/index.html

      - name: Build ${{ matrix.output }}
        run: |
          mkdir -p dist
          export CGO_ENABLED=0
          export GOOS="${{ matrix.os }}"
          export GOARCH="${{ matrix.arch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            export GOARM="${{ matrix.goarm }}"
          fi
          go build \
            -trimpath \
            -ldflags "-s -w -X main.Version=${{ needs.version.outputs.version }} -X main.Commit=${{ needs.version.outputs.tag_sha }} -X main.BuildTime=${{ needs.version.outputs.build_time }}" \
            -o "dist/${{ matrix.output }}" \
            "${{ matrix.cmd_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 30

  build-agent:
    needs: [version, verify-go]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: agent
            cmd_path: ./cmd/agent
            os: linux
            arch: amd64
            output: cyber-monitor-agent-linux-amd64
          - name: agent
            cmd_path: ./cmd/agent
            os: linux
            arch: arm64
            output: cyber-monitor-agent-linux-arm64
          - name: agent
            cmd_path: ./cmd/agent
            os: linux
            arch: arm
            goarm: 7
            output: cyber-monitor-agent-linux-armv7
          - name: agent
            cmd_path: ./cmd/agent
            os: darwin
            arch: amd64
            output: cyber-monitor-agent-darwin-amd64
          - name: agent
            cmd_path: ./cmd/agent
            os: darwin
            arch: arm64
            output: cyber-monitor-agent-darwin-arm64
          - name: agent
            cmd_path: ./cmd/agent
            os: windows
            arch: amd64
            output: cyber-monitor-agent-windows-amd64.exe
          - name: agent
            cmd_path: ./cmd/agent
            os: windows
            arch: arm64
            output: cyber-monitor-agent-windows-arm64.exe
          - name: agent
            cmd_path: ./cmd/agent
            os: freebsd
            arch: amd64
            output: cyber-monitor-agent-freebsd-amd64
          - name: agent
            cmd_path: ./cmd/agent
            os: freebsd
            arch: arm64
            output: cyber-monitor-agent-freebsd-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build ${{ matrix.output }}
        run: |
          mkdir -p dist
          export CGO_ENABLED=0
          export GOOS="${{ matrix.os }}"
          export GOARCH="${{ matrix.arch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            export GOARM="${{ matrix.goarm }}"
          fi
          go build \
            -trimpath \
            -ldflags "-s -w -X main.Version=${{ needs.version.outputs.version }} -X main.Commit=${{ needs.version.outputs.tag_sha }} -X main.BuildTime=${{ needs.version.outputs.build_time }}" \
            -o "dist/${{ matrix.output }}" \
            "${{ matrix.cmd_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 30

  build-admin:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag_sha }}
          persist-credentials: false

      - name: Verify build inputs
        id: build-inputs
        run: |
          GO_VERSION="$(awk '/^go / { print $2; exit }' go.mod)"
          DOCKER_GO_VERSION="$(awk -F= '/^ARG GO_IMAGE_VERSION=/ { print $2; exit }' Dockerfile)"
          NODE_VERSION="$(awk -F= '/^ARG NODE_IMAGE_VERSION=/ { print $2; exit }' Dockerfile)"
          if [ -z "$GO_VERSION" ] || [ -z "$DOCKER_GO_VERSION" ] || [ -z "$NODE_VERSION" ]; then
            echo "Unable to resolve Go or Node build version" >&2
            exit 1
          fi
          if ! printf '%s' "$NODE_VERSION" | grep -Eq '^[0-9]+([.][0-9]+){0,2}$'; then
            echo "Node version must be numeric, got: $NODE_VERSION" >&2
            exit 1
          fi
          if [ "$GO_VERSION" != "$DOCKER_GO_VERSION" ]; then
            echo "Go version drift detected: go.mod=$GO_VERSION, Dockerfile GO_IMAGE_VERSION=$DOCKER_GO_VERSION" >&2
            exit 1
          fi
          for path in \
            internal/server/web/admin/package.json \
            internal/server/web/admin/package-lock.json \
            internal/server/web/admin/src/App.tsx \
            internal/server/web/admin/lib/admin-ui.ts \
            internal/server/web/public/index.html \
            internal/server/web/public/assets/styles.css \
            internal/server/web/public/assets/theme.js \
            internal/server/web/public/assets/monitor.js \
            scripts/build-local.sh \
            scripts/install-common.sh \
            scripts/agent.sh \
            scripts/one-click.sh \
            scripts/agent-uninstall.sh \
            scripts/docker-entrypoint.sh \
            scripts/agent.ps1 \
            scripts/agent-uninstall.ps1
          do
            test -e "$path"
          done
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify install scripts
        run: |
          bash -n scripts/build-local.sh
          bash -n scripts/install-common.sh
          bash -n scripts/agent.sh
          bash -n scripts/one-click.sh
          bash -n scripts/agent-uninstall.sh
          sh -n scripts/docker-entrypoint.sh

      - name: Verify PowerShell install scripts
        shell: pwsh
        run: |
          foreach ($file in @("scripts/agent.ps1", "scripts/agent-uninstall.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              exit 1
            }
          }

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.build-inputs.outputs.node_version }}
          cache: 'npm'
          cache-dependency-path: internal/server/web/admin/package-lock.json

      - name: Build admin assets
        run: |
          npm --prefix internal/server/web/admin ci
          npm --prefix internal/server/web/admin run lint
          npm --prefix internal/server/web/admin run build:admin

      - name: Package synced admin assets
        run: |
          test -f internal/server/web/dist/admin/index.html
          tar -czf admin-web-sync.tar.gz -C internal/server/web dist/admin
          tar -tzf admin-web-sync.tar.gz | grep -qx 'dist/admin/index.html'

      - name: Upload synced admin assets
        uses: actions/upload-artifact@v7
        with:
          name: admin-web-sync
          path: admin-web-sync.tar.gz
          retention-days: 30

  verify-powershell-installers:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag_sha }}
          persist-credentials: false

      - name: Verify PowerShell install scripts with Windows PowerShell
        shell: powershell
        run: |
          $files = @("scripts/agent.ps1", "scripts/agent-uninstall.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}: {1}" -f $file, $_.Message) }
              exit 1
            }
          }

  docker-images:
    needs: [version, build-server, build-agent, verify-powershell-installers]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      IMAGE_PREFIX: ghcr.io/${{ needs.version.outputs.image_repo }}
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      matrix:
        include:
          - target: release-server
            suffix: server
            scope: server
          - target: release-agent
            suffix: agent
            scope: agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag_sha }}
          persist-credentials: false

      - name: Download admin assets
        uses: actions/download-artifact@v8
        with:
          name: admin-web-sync
          path: .

      - name: Restore admin assets
        run: |
          mkdir -p internal/server/web
          tar -xzf admin-web-sync.tar.gz -C internal/server/web
          test -f internal/server/web/dist/admin/index.html

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_TOKEN != '' && github.repository_owner || github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_PREFIX}-${{ matrix.suffix }}:${{ needs.version.outputs.tag }}"
            if [ "${{ needs.version.outputs.stable }}" = "true" ]; then
              echo "${IMAGE_PREFIX}-${{ matrix.suffix }}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image-tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ needs.version.outputs.tag_sha }}
            BUILD_TIME=${{ needs.version.outputs.build_time }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  release:
    needs: [version, build-server, build-agent, docker-images, verify-powershell-installers]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve changelog range
        id: changelog
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          TAG_SHA="${{ needs.version.outputs.tag_sha }}"
          PREV=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${TAG_SHA}^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            PREV="$TAG"
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          else
            URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
          fi
          echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"
          echo "prev_version=${PREV#v}" >> "$GITHUB_OUTPUT"
          echo "compare_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          pattern: "cyber-monitor-*"

      - name: Download synced admin assets
        uses: actions/download-artifact@v8
        with:
          name: admin-web-sync
          path: artifacts

      - name: Restore synced admin assets
        run: |
          mkdir -p internal/server/web
          tar -xzf artifacts/admin-web-sync.tar.gz -C internal/server/web
          test -f internal/server/web/dist/admin/index.html

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -name "cyber-monitor-*" -exec cp {} release/ \;
          find release -type f -name "cyber-monitor-*" ! -name "*.exe" -exec chmod +x {} \;

      - name: Package web assets for release
        run: |
          tar -czf release/web-dist.tar.gz -C internal/server/web public dist/admin
          (cd internal/server/web && zip -r ../../../release/web-dist.zip public dist/admin)
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Verify release checksums
        run: |
          expected_assets=(
            "cyber-monitor-agent-linux-amd64"
            "cyber-monitor-agent-linux-arm64"
            "cyber-monitor-agent-linux-armv7"
            "cyber-monitor-agent-darwin-amd64"
            "cyber-monitor-agent-darwin-arm64"
            "cyber-monitor-agent-windows-amd64.exe"
            "cyber-monitor-agent-windows-arm64.exe"
            "cyber-monitor-agent-freebsd-amd64"
            "cyber-monitor-agent-freebsd-arm64"
            "cyber-monitor-server-linux-amd64"
            "cyber-monitor-server-linux-arm64"
            "cyber-monitor-server-linux-armv7"
            "cyber-monitor-server-darwin-amd64"
            "cyber-monitor-server-darwin-arm64"
            "cyber-monitor-server-windows-amd64.exe"
            "cyber-monitor-server-freebsd-amd64"
            "cyber-monitor-server-freebsd-arm64"
            "web-dist.tar.gz"
            "web-dist.zip"
          )
          for asset in "${expected_assets[@]}"; do
            test -f "release/${asset}"
            grep -F "  ${asset}" release/SHA256SUMS
          done
          (cd release && sha256sum -c SHA256SUMS)
          release_count="$(find release -maxdepth 1 -type f ! -name SHA256SUMS | wc -l | tr -d '[:space:]')"
          if [ "${release_count}" -ne "${#expected_assets[@]}" ]; then
            echo "release asset count mismatch: got ${release_count}, want ${#expected_assets[@]}" >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE: ${{ needs.version.outputs.stable }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          NOTES="Full Changelog: [${{ steps.changelog.outputs.prev_tag }}...${TAG}](${{ steps.changelog.outputs.compare_url }})"
          RELEASE_FLAGS=()
          if [ "$STABLE" = "true" ]; then
            RELEASE_FLAGS+=(--latest)
          else
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/cyber-monitor-* release/web-dist.tar.gz release/web-dist.zip release/SHA256SUMS --clobber
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes "$NOTES" \
              "${RELEASE_FLAGS[@]}"
          else
            gh release create "$TAG" release/cyber-monitor-* release/web-dist.tar.gz release/web-dist.zip release/SHA256SUMS \
              --title "$TAG" \
              --notes "$NOTES" \
              --target "${{ needs.version.outputs.tag_sha }}" \
              "${RELEASE_FLAGS[@]}"
          fi
