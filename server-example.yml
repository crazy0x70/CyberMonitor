services:
  server:
    # 示例：CM_VERSION=v0.6.0 docker compose -f server-example.yml up -d
    image: ghcr.io/crazy0x70/cyber-monitor-server:${CM_VERSION:?set CM_VERSION}
    container_name: cyber-monitor-server
    restart: always
    network_mode: bridge
    ports:
      # 管理后台端口（Admin API / 管理后台页面）
      - "25012:25012"
      # 展示接口端口（Agent 上报 / Agent gRPC / Public API / Public WS）
      # 如需分离管理端与展示接口，请同时取消下一行注释，并设置 CM_PUBLIC_LISTEN=25013。
      # - "25013:25013"
    environment:
      # 可选：启用“硬隔离”模式后，展示页与管理后台分别监听不同端口。
      # 例如：CM_PUBLIC_LISTEN=25013
      # 新版 Agent 默认优先尝试 gRPC；如果前置代理不支持 HTTP/2 / h2c，会自动回退到 HTTP。
      CM_PUBLIC_LISTEN: "${CM_PUBLIC_LISTEN:-}"
      CM_DATA_DIR: /data
      # 管理后台 Docker 一键更新需要显式 opt-in；挂载 docker.sock 并确认风险后再改为 "1"。
      CM_ENABLE_DOCKER_UPDATE: "0"
    volumes:
      - ./data:/data
      # 管理后台 Docker 一键更新需要访问 docker.sock；启用前确认宿主机控制风险，并设置：
      # CM_ENABLE_DOCKER_UPDATE: "1"
      # - /var/run/docker.sock:/var/run/docker.sock
