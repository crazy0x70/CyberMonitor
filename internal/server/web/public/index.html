<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f4f7fb"
      id="theme-color-light"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0b1220"
      id="theme-color-dark"
    />
    <title>CyberMonitor</title>
    <link rel="icon" id="site-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f5dff'/%3E%3Cpath d='M18 40L28 24l8 10 10-14' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <h1 class="brand-heading">
            <a class="brand brand-link" id="brand-title" href="./">
              CyberMonitor
            </a>
          </h1>
          <p class="subtitle" id="brand-subtitle" data-i18n="brandSubtitle">主机监控</p>
        </div>
        <div class="topbar-right">
          <div class="topbar-actions" aria-label="展示偏好">
            <div class="control-menu">
              <button
                class="control-toggle language-toggle"
                id="language-toggle"
                type="button"
                aria-label="切换语言"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="language-menu"
              >
                <span class="control-icon language-icon" id="language-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m5 8 6 6"></path>
                    <path d="m4 14 6-6 2-3"></path>
                    <path d="M2 5h12"></path>
                    <path d="M7 2h1"></path>
                    <path d="m22 22-5-10-5 10"></path>
                    <path d="M14 18h6"></path>
                  </svg>
                </span>
              </button>
              <div class="control-menu-panel" id="language-menu" role="menu" hidden>
                <button class="control-menu-item" type="button" role="menuitemradio" data-locale-option="zh-CN" aria-checked="true">简体中文</button>
                <button class="control-menu-item" type="button" role="menuitemradio" data-locale-option="en-US" aria-checked="false">English</button>
              </div>
            </div>
            <div class="control-menu">
              <button
                class="control-toggle theme-toggle"
                id="theme-toggle"
                type="button"
                aria-label="主题：跟随系统"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="theme-menu"
              >
                <span class="control-icon" id="theme-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                    <path d="M8 20h8"></path>
                    <path d="M12 16v4"></path>
                  </svg>
                </span>
              </button>
              <div class="control-menu-panel" id="theme-menu" role="menu" hidden>
                <button class="control-menu-item" type="button" role="menuitemradio" data-theme-option="auto" aria-checked="true" data-i18n="themeAuto">跟随系统</button>
                <button class="control-menu-item" type="button" role="menuitemradio" data-theme-option="light" aria-checked="false" data-i18n="themeLight">浅色主题</button>
                <button class="control-menu-item" type="button" role="menuitemradio" data-theme-option="dark" aria-checked="false" data-i18n="themeDark">深色主题</button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main id="public-main-content">
      <section class="stats-grid">
        <button class="stat-card stat-filter-button" type="button" data-filter="all">
          <div class="stat-label" data-i18n="statTotal">服务器总数</div>
          <div class="stat-value">
            <span class="stat-dot blue"></span>
            <span id="stat-total">0</span>
          </div>
        </button>
        <button class="stat-card stat-filter-button" type="button" data-filter="online">
          <div class="stat-label" data-i18n="statOnline">在线服务器</div>
          <div class="stat-value">
            <span class="stat-dot green"></span>
            <span id="stat-online">0</span>
          </div>
        </button>
        <button class="stat-card stat-filter-button" type="button" data-filter="offline">
          <div class="stat-label" data-i18n="statOffline">离线服务器</div>
          <div class="stat-value">
            <span class="stat-dot red"></span>
            <span id="stat-offline">0</span>
          </div>
        </button>
        <div class="stat-card">
          <div class="stat-label" data-i18n="statNetwork">网络信息</div>
          <div class="stat-lines">
            <div id="stat-net-usage">--</div>
            <div id="stat-net-rate">--</div>
          </div>
        </div>
      </section>

      <nav id="group-tabs" class="group-tabs" aria-label="节点分组导航" data-i18n-attr="aria-label:groupTabsLabel"></nav>

      <section id="list" class="node-list"></section>

      <div id="empty" class="empty">
        <h2 data-i18n="emptyWaitingTitle">等待节点接入</h2>
        <p data-i18n="emptyWaitingBody">请启动 Agent 并指向当前管理端地址。</p>
      </div>

      <footer class="site-footer">
        <div class="footer-left">
          <span id="footer-year">©2025-2025</span>
          <a href="https://github.com/crazy0x70/CyberMonitor" target="_blank" rel="noreferrer">CyberMonitor</a>
        </div>
        <div class="footer-right">
          <span data-i18n="poweredBy">Powered by</span> <a href="https://github.com/crazy0x70" target="_blank" rel="noreferrer">Crazy0x70</a>
        </div>
      </footer>
      </main>
    </div>

    <script src="./assets/theme.js"></script>
    <script src="./assets/monitor.js"></script>
  </body>
</html>
